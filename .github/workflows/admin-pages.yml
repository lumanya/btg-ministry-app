# Publishes to GitHub Pages whenever the app or the dashboard changes on main:
#   https://app.btgministry.org/        the app as a web page, for iPhone and PC
#                                       (Add to Home Screen)
#   https://app.btgministry.org/admin/  the staff dashboard (admin/)
# The custom domain is set in the repository's Settings → Pages, with a CNAME
# record app.btgministry.org → lumanya.github.io at the domain's DNS (Linode).
name: Staff dashboard and web app

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env'
      - 'scripts/web-pwa.mjs'
      - '.github/workflows/admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Dashboard
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build

      - name: Web app
        env:
          CI: '1'
        run: |
          npm ci
          npx expo export -p web --output-dir site
          node scripts/web-pwa.mjs site

      - name: Put the dashboard under /admin
        run: |
          mkdir -p site/admin
          cp -r admin/dist/. site/admin/
          # Privacy, support and account-deletion pages also stay at their old place.
          cp admin/public/privacy.html admin/public/support.html admin/public/delete-account.html admin/public/legal.css admin/public/eagle.png site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Publishing runs as its own step once the upload has finished (GitHub's standard
  # setup; doing both in one job sometimes failed with "No artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
